/* FIXED: app UI fills the browser viewport; no device frame, no outside stage */
html,body{width:100%;height:100%;overflow:hidden}
body{background:#ecf5ff}
.workbench{display:block;width:100%;max-width:none;margin:0;padding:0;gap:0}
.studio-panel{display:none!important}
.device{position:relative;width:100%;height:100dvh;min-height:0;max-height:none;border-radius:0;box-shadow:none;flex:1;isolation:isolate}
.device::before{inset:0}
.ambient svg{width:100%;right:0;top:-18px;max-height:275px}
.viewport{width:100%;height:100%;padding-bottom:100px}
.viewport>main{width:min(100%,650px);margin:0 auto}
.home,.page{padding-left:22px;padding-right:22px}
.nav{max-width:605px;left:50%;right:auto;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 36px)}

.confirm-box{max-width:430px}
.toast{position:fixed}
.channel-card{transition:transform .16s ease,box-shadow .16s ease}
.channel-card:hover{transform:translateY(-2px);box-shadow:0 19px 35px #497ab824}
.channel-preview{aspect-ratio:1.72/1;height:auto!important}
.channel-label{min-height:63px}

.settings-brand strong{display:block;font-size:15px}.settings-brand small{display:block;color:#809aba;margin-top:5px;font-size:11px}.settings-brand .tiny-pill{margin-left:auto}

function chById(id){return [...channels,...state.customChannels].find(c=>c.id===id)||channels[0]}
function channelImage(c){return ASSETS['thumb_'+c.id]||ASSETS.thumb_cctv}
function channelLogo(c){return ASSETS['logo_'+c.id]||''}
function card(c){return `<button class="channel-card" data-act="play" data-id="${esc(c.id)}"><img class="channel-preview" src="${channelImage(c)}" alt="${esc(c.name)}频道预览"/><div class="channel-label">${channelLogo(c)?`<img class="channel-logo ${c.id}" src="${channelLogo(c)}" alt="${esc(c.name)}台标"/>`:`<span class="setting-icon">${I('tv')}</span>`}<span class="channel-name">${esc(c.name)}</span><span class="channel-arrow">${I('chevron-right')}</span></div></button>`}
function heading(title,right='',back='home'){return `<header class="page-header"><button class="nav-back" data-act="back" aria-label="返回">${I('arrow-left')}</button><h1 class="page-title">${title}</h1><div class="head-actions">${right||'<span style="width:36px"></span>'}</div></header>`}
function section(title,link='',sub=''){return `<div class="section-header"><h3 class="section-title">${title}</h3>${link||`<span class="section-desc">${sub}</span>`}</div>`}
function rowIcon(icon,title,desc='',action='',right='',toggled=false){return `<div class="setting-row" ${action?`data-act="${action}"`:''}><div class="row-left" style="flex:1">${icon?`<span class="setting-icon">${I(icon)}</span>`:''}<div class="setting-text">${title}${desc?`<small>${desc}</small>`:''}</div></div><div class="setting-end">${right}${action?I('chevron-right','sm'):''}</div></div>`}
function toggleRow(icon,title,desc,key){return `<div class="setting-row"><div class="row-left" style="flex:1"><span class="setting-icon">${I(icon)}</span><div class="setting-text">${title}${desc?`<small>${desc}</small>`:''}</div></div><button class="toggle ${state.settings[key]?'on':''}" data-act="toggle" data-key="${key}" role="switch" aria-checked="${state.settings[key]}" aria-label="${title}"></button></div>`}
function empty(icon,title,desc,cta='',action=''){return `<div class="empty"><div class="empty-graphic">${I(icon,'xl')}</div><h3>${title}</h3><p>${desc}</p>${cta?`<button class="btn primary" data-act="${action}">${cta}${I('arrow-right','sm')}</button>`:''}</div>`}
function grid(list){return list.length?`<div class="channel-grid">${list.map(card).join('')}</div>`:empty('tv','这里还没有频道','添加直播源之后，就能在这里浏览电视台。','添加直播源','go-source-add')}
function currentChannels(){if(!state.source||!state.sources.length)return [];return state.sources.find(s=>s.name===state.source)?.type==='手动频道'?state.customChannels:channels}

function home(){let group=state.group;let list=currentChannels().filter(c=>group==='全部'||c.group===group);return `<main class="home"><div class="home-top"><div><h1 class="app-name">电视直播</h1><button class="source-pill" data-go="sources">${I('monitor','sm')}<span class="ellipsis">当前直播源 · ${esc(state.source)}</span>${I('chevron-right','sm')}</button></div><button class="top-tv" data-go="sources" aria-label="管理直播源">${I('tv','lg')}</button></div><button class="search-faux" data-go="search">${I('search')}<span>搜索频道 / 电视台</span></button><div class="chips">${state.groups.map(g=>`<button class="chip ${group===g?'active':''}" data-act="set-group" data-val="${g}">${g}</button>`).join('')}</div>${grid(list)}</main>`}
function favorites(){let fav=state.favorites.map(chById).filter(Boolean);return `<main class="page">${heading('我的收藏',`<button class="header-action" data-act="edit-favorites">管理</button>`)}<div class="feature-card"><div class="kicker" style="color:#fff">${I('heart','sm')} YOUR FAVORITES</div><div class="feature-num">${fav.length} <span style="font-size:13px;font-weight:500">个喜爱的频道</span></div><p>喜欢的电视节目，轻松一键直达</p></div>${section('收藏频道',null,`共 ${fav.length} 个`)}${fav.length?grid(fav):empty('heart','还没有收藏频道','浏览频道时轻点收藏，常看的电视台会出现在这里。','去逛逛','go-home')}${fav.length?`<p class="info-tip">${I('info')}长按频道可进入播放页并调整收藏；也可以点击右上角管理。</p>`:''}</main>`}
function recent(){let list=state.recent.map(chById);return `<main class="page">${heading('最近观看',`<button class="header-action" data-act="clear-recent">清空</button>`)}<div class="feature-card"><div class="kicker" style="color:#fff">${I('clock','sm')} RECENTLY WATCHED</div><div class="feature-num">${list.length} <span style="font-size:13px;font-weight:500">条观看记录</span></div><p>精彩继续，从上次观看处再次开启</p></div>${section('观看历史',null,'按最近播放排序')}${list.length?list.map((c,i)=>`<div class="list-card"><img class="list-thumb" src="${channelImage(c)}"/><div class="list-body"><div class="row-title">${esc(c.name)}</div><p class="row-sub">${esc(c.source)} · ${i===0?'刚刚':i===1?'今天 14:28':'昨天 20:16'}</p><div class="little-actions"><button class="tiny-link" data-act="play" data-id="${c.id}">${I('play','sm')}继续观看</button><button class="tiny-link" data-act="toggle-fav" data-id="${c.id}">${I('heart','sm')}${state.favorites.includes(c.id)?'已收藏':'收藏'}</button><button class="tiny-link" data-act="remove-recent" data-id="${c.id}">${I('trash','sm')}</button></div></div></div>`).join(''):empty('clock','暂无观看记录','播放频道后，观看过的电视台会自动保存在这里。','去看电视','go-home')}</main>`}
function searchPage(){return `<main class="page"><div class="search-inline"><button class="nav-back" data-act="back">${I('arrow-left')}</button><div class="search-box">${I('search','sm')}<input id="search-input" placeholder="搜索频道名称 / 电视台" autocomplete="off" value="${esc(state.search)}"/><button class="search-clear" data-act="clear-search">${I('x','sm')}</button></div><button class="text-button" data-act="back">取消</button></div><div id="search-results">${searchResults()}</div></main>`}
function searchResults(){const q=state.search.trim().toLowerCase();let list=[...channels,...state.customChannels].filter(c=>q&&[c.name,c.detail,c.source,c.group].join(' ').toLowerCase().includes(q));return q?`<div class="result-head"><span>搜索“${esc(q)}”</span><span>${list.length} 个结果</span></div>${list.length?grid(list):empty('search-x','未找到相关频道','试试输入频道名称中的其他关键词。')}`:`${section('热门搜索',null,'快速找到常看的电视台')}<div class="chips">${['央视新闻','湖南卫视','贵州卫视','体育'].map(x=>`<button class="chip" data-act="hot-search" data-val="${x}">${x}</button>`).join('')}</div>${section('推荐频道')} ${grid(channels.slice(0,4))}`}
function player(){let c=chById(state.current);let list=currentChannels().filter(c=>state.playerGroup==='全部'||c.group===state.playerGroup);return `<main class="page">${heading('正在播放',`<button class="round-icon" data-go="epg" aria-label="节目单">${I('calendar')}</button>`)}<div class="video-shell"><img src="${channelImage(c)}" alt="${esc(c.name)}预览画面"/><div class="video-shade"></div><div class="video-top"><span class="muted-chip" style="color:white;background:#ffffff40;border-color:#ffffff45">${esc(c.name)}</span><button class="icon-plain" data-go="fullscreen">${I('expand')}</button></div><button class="play-big" data-act="toggle-play" aria-label="播放暂停">${I(state.playing?'pause':'play','xl')}</button><div class="video-caption"><h3>${esc(c.name)}</h3><p>${state.showPlayingError?'播放异常 · 可重试连接':state.playing?'画面演示 · 实际播放需接入视频解码器':'已暂停'} </p></div></div><div class="player-actions"><button class="player-act ${state.favorites.includes(c.id)?'on':''}" data-act="toggle-fav" data-id="${c.id}">${I('heart')}<span>${state.favorites.includes(c.id)?'已收藏':'收藏'}</span></button><button class="player-act" data-act="show-pip">${I('picture-in-picture')}<span>小窗</span></button><button class="player-act" data-go="audio">${I('headphones')}<span>听音</span></button><button class="player-act" data-go="epg">${I('calendar')}<span>节目单</span></button></div><div class="volume-row"><button class="tiny-link" data-act="volume-down">${I('volume-1')}</button><input class="range" id="volume-range" type="range" min="0" max="100" value="${state.volume}" aria-label="媒体音量"><button class="tiny-link" data-act="volume-up">${I('volume-2')}</button><span class="volume-count">${state.volume}%</span></div>${state.showPlayingError?`<div class="glass-card"><b style="font-size:13px;color:#c74c62">连接失败，播放地址可能已过期</b><p class="row-sub" style="margin:7px 0 12px">可重试连接、切换下一台，或刷新所属直播源。</p><div class="button-row"><button class="btn secondary small" data-act="retry">重试</button><button class="btn secondary small" data-act="next-channel">下一台</button><button class="btn secondary small" data-act="refresh-current-source">刷新订阅</button></div></div>`:''}<div class="player-list-head"><strong class="section-title">频道列表</strong><span class="soft-count">${list.length} 个频道</span></div><div class="player-group">${state.groups.map(g=>`<button class="chip ${g===state.playerGroup?'active':''}" data-act="player-group" data-val="${g}">${g}</button>`).join('')}</div>${list.length?list.map(ch=>`<button class="station-row ${ch.id===c.id?'playing':''}" data-act="play" data-id="${ch.id}"><img src="${channelImage(ch)}"/><span style="flex:1"><strong>${esc(ch.name)}</strong><small>${esc(ch.detail)}</small></span>${ch.id===c.id?`<span class="playing-mark">${I('volume-2','sm')} 正在播放</span>`:I('play')}</button>`).join(''):empty('tv','此分组暂无频道','切换其他分组看看吧。')}<button class="text-button" data-go="playback-error" style="margin:12px 0">查看播放异常设计预览 ${I('arrow-right','sm')}</button></main>`}
function epg(){let c=chById(state.current),d=new Date(),ds=[-1,0,1].map(v=>{let dt=new Date(d);dt.setDate(dt.getDate()+v);return {n:dt.getMonth()+1+'/'+dt.getDate(),label:v===0?'今天':v<0?'昨天':'明天'}});return `<main class="page">${heading('电视节目单',`<button class="round-icon" data-act="epg-refresh">${I('refresh-cw')}</button>`)}<div class="glass-card row-between"><div class="row-left"><img src="${channelLogo(c)||channelImage(c)}" style="width:61px;height:42px;object-fit:contain;border-radius:10px"/><div><div class="row-title">${esc(c.name)}</div><p class="row-sub">当前匹配 · ${esc(state.epgMatched)}</p></div></div><button class="btn secondary small" data-go="epg-match">更换匹配</button></div><div class="info-tip">${I('info')}节目单由 EPG 订阅提供；本版本仅供浏览，不包含回看或预约提醒。</div>${section('日期选择')}<div class="day-strip">${ds.map((d,i)=>`<button class="day-item ${i===state.epgDay?'active':''}" data-act="epg-day" data-val="${i}"><small>${d.label}</small><strong>${d.n}</strong></button>`).join('')}</div>${section('全天节目',null,'来源 · 全国 EPG')}<div class="glass-card" style="padding:4px 14px">${epgPrograms.map(([t,t2,name,status],i)=>`<div class="program-row ${status==='正在播出'?'now':''}"><div class="program-time">${t}<div style="font-size:9px;font-weight:400;margin-top:4px">${t2}</div></div><div class="program-text"><strong>${state.epgDay===2&&i===2?'特别直播：精彩看点':name}</strong><small>${esc(c.name)} · 电视节目</small></div><span class="program-state" style="${status==='已播出'?'background:#f0f3f7;color:#a3aec0':''}">${status}</span></div>`).join('')}</div></main>`}
function epgMatch(){return `<main class="page">${heading('匹配节目单频道')}<div class="search-box">${I('search','sm')}<input placeholder="搜索 EPG 频道" id="epg-search" value="${esc(state.epgMatched)}"/></div><div class="info-tip">${I('info')}手动选择节目单频道后，当前电视台会优先使用此匹配结果。</div>${section('候选频道',null,'来自已启用的 EPG 来源')}<div id="match-list">${matchList(state.epgMatched)}</div><button class="btn secondary block" style="margin-top:13px" data-act="restore-match">${I('refresh-cw','sm')} 恢复自动匹配</button></main>`}
function matchList(q){let opts=['央视新闻','CCTV-13 新闻','CCTV-1 综合','贵州卫视','湖南卫视','北京卫视','东方卫视'];const l=opts.filter(x=>x.toLowerCase().includes(q.trim().toLowerCase())||!q);return l.length?l.map((x,i)=>`<label class="match-row"><span class="setting-icon">${I('tv')}</span><div><strong>${x}</strong><small>${i%2===0?'全国 EPG':'内置节目单'} · XMLTV</small></div><input type="radio" name="match" value="${x}" ${state.epgMatched===x?'checked':''}></label>`).join(''):empty('search-x','没有匹配结果','可以使用更短的关键词重新搜索。')}
function audio(){let c=chById(state.current);return `<main class="page">${heading('听音模式')}<p class="page-subtitle" style="text-align:center;margin-top:13px">关闭屏幕后，也能继续聆听喜爱的节目</p><div class="audio-cover">${channelLogo(c)?`<img src="${channelLogo(c)}"/>`:I('radio','xl')}<div class="sound-bars" style="position:absolute;bottom:23px">${Array.from({length:4},()=>'<b></b>').join('')}</div></div><h2 style="font-size:20px;text-align:center;margin:0">${esc(c.name)}</h2><p class="subtle" style="text-align:center;margin:8px 0">${state.audioOn?'正在后台播放音频':'听音已就绪 · 点按播放开启'}</p><div class="media-control"><button data-act="prev-channel">${I('skip-back','lg')}</button><button class="main" data-act="audio-play">${I(state.audioOn?'pause':'play','xl')}</button><button data-act="next-channel">${I('skip-forward','lg')}</button></div><div class="glass-card"><div class="row-between"><div class="row-left"><span class="setting-icon">${I('headphones')}</span><div><div class="row-title">后台听音</div><p class="row-sub">支持息屏与系统媒体控制</p></div></div><span class="muted-chip">${state.audioOn?'已开启':'未开启'}</span></div></div><div class="info-tip">${I('info')}系统通知与锁屏可进行播放、暂停、停止。清理应用后会停止播放；此 HTML 为界面交互演示。</div><button class="btn secondary block" data-act="exit-audio">${I('monitor','sm')} 退出听音并恢复视频</button></main>`}
function pipInfo(){return `<main class="page">${heading('小窗播放')}<div class="glass-card" style="padding:24px 15px;text-align:center"><div style="margin:5px auto 18px;width:230px;height:143px;border:1px solid #fff;border-radius:20px;background:linear-gradient(145deg,#c7e1ff,#f0f8ff);position:relative;padding:18px">${I('monitor','xl')}<div style="position:absolute;right:10px;bottom:11px;width:110px;height:65px;border-radius:12px;overflow:hidden;border:3px solid white;box-shadow:0 6px 12px #3777b439"><img src="${ASSETS.thumb_cctv}" style="width:100%;height:100%;object-fit:cover"/></div></div><h3 style="font-size:17px">边使用手机，边看电视</h3><p class="subtle" style="line-height:1.8">开启小窗后，可以在其他应用上方继续观看直播。具体按钮与行为由 Android 系统提供。</p></div>${section('小窗设置')}<div class="setting-list">${toggleRow('picture-in-picture','返回桌面自动小窗','需要系统允许画中画权限','autoPip')}${rowIcon('shield','小窗权限','前往 Android 系统设置进行授权','go-permissions')}</div><button class="btn primary block" data-act="show-pip">${I('picture-in-picture','sm')} 查看小窗演示</button></main>`}
function permissions(){return `<main class="page">${heading('小窗权限引导')}${empty('shield-check','允许显示画中画','首次进入小窗时，请在 Android 设置中允许本应用使用画中画功能。')}<div class="glass-card"><div class="section-title">授权步骤</div>${['打开系统应用设置','选择“电视直播”','启用“画中画”权限','返回应用并再次尝试'].map((x,i)=>`<div class="program-row"><div class="program-time" style="color:#1479f4">0${i+1}</div><div class="program-text"><strong>${x}</strong></div></div>`).join('')}</div><button class="btn primary block" data-act="mock-settings">${I('external-link','sm')} 前往系统设置</button></main>`}
function sources(){return `<main class="page">${heading('直播源管理',`<button class="round-icon" data-go="source-add">${I('plus')}</button>`)}<div class="feature-card"><div class="kicker" style="color:#fff">${I('layers','sm')} SOURCE LIBRARY</div><div class="feature-num">${state.sources.length} <span style="font-size:13px;font-weight:500">个直播源</span></div><p>轻松管理在线订阅、本地文件和自建频道</p></div>${section('全部来源',null,'点击切换当前来源')}${state.sources.map(s=>`<div class="source-card ${state.source===s.name?'current':''}"><div class="row-between"><div class="row-left"><span class="source-icon ${s.type==='本地文件'?'local':s.type==='手动频道'?'manual':''}">${I(s.type==='在线订阅'?'wifi':s.type==='本地文件'?'folder':'plus-circle','lg')}</span><div><div class="row-title">${esc(s.name)}</div><p class="row-sub">${s.type} · ${s.updated}</p></div></div>${state.source===s.name?`<span class="tiny-pill" style="color:#0d72e8">${I('check','sm')} 使用中</span>`:`<button class="btn small secondary" data-act="select-source" data-name="${esc(s.name)}">切换</button>`}</div><div class="source-tags"><span>${s.channels} 个频道</span><span>${s.groups} 个分组</span><span>${s.type}</span></div><div class="source-actions"><button data-act="source-detail" data-name="${esc(s.name)}">${I('settings','sm')} 管理</button><button data-act="refresh-source" data-name="${esc(s.name)}">${I('refresh-cw','sm')} 刷新</button><button data-act="delete-source" data-name="${esc(s.name)}">${I('trash','sm')} 删除</button></div></div>`).join('')}<button class="btn primary block" style="margin-top:16px" data-go="source-add">${I('plus','sm')} 添加新的直播源</button></main>`}
function sourceDetail(){let s=state.sources.find(x=>x.name===state.editSource)||state.sources[0];return `<main class="page">${heading('直播源详情')}<div class="glass-card"><div class="row-left"><span class="source-icon">${I('radio','lg')}</span><div><div class="row-title">${esc(s.name)}</div><p class="row-sub">${s.type} · ${s.channels} 个频道</p></div></div><div class="metrics"><div class="metric"><b>${s.channels}</b><small>频道</small></div><div class="metric"><b>${s.groups}</b><small>分组</small></div><div class="metric"><b>1</b><small>来源</small></div></div><p class="row-sub">最近更新：${s.updated}</p></div><label class="field-label">直播源名称</label><input class="field" id="edit-source-name" value="${esc(s.name)}"/><label class="field-label">${s.type==='在线订阅'?'订阅地址':s.type==='本地文件'?'已导入文件':'来源类型'}</label>${s.type==='在线订阅'?`<textarea class="field textarea" id="edit-source-url">${esc(s.url||'')}</textarea>`:s.type==='本地文件'?`<div class="upload-area">${I('file','lg')}<h3>${s.file||'未选文件'}</h3><input type="file" id="replace-file" accept=".m3u,.m3u8,.txt"/></div>`:`<div class="code-copy">自建频道集合，可在下方管理分组和频道</div>`}<div class="button-row" style="margin-top:16px"><button class="btn secondary" data-act="save-source">${I('save','sm')} 保存修改</button><button class="btn primary" data-act="refresh-source" data-name="${esc(s.name)}">${I('refresh-cw','sm')} 刷新来源</button></div>${s.type==='手动频道'?`<div class="button-row" style="margin-top:10px"><button class="btn secondary" data-go="group-edit">管理分组</button><button class="btn secondary" data-go="source-manual">添加频道</button><button class="btn secondary" data-go="channel-edit">编辑频道</button></div>`:''}<button class="btn danger block" data-act="delete-source" data-name="${esc(s.name)}" style="margin-top:13px">${I('trash','sm')} 删除直播源</button></main>`}
function sourceAdd(){return `<main class="page">${heading('添加直播源')}<p class="page-subtitle">选择添加方式，轻松开启您的电视直播</p><div class="type-cards"><button class="type-card" data-go="source-online"><span class="type-icon">${I('link','xl')}</span><div><h4>在线订阅</h4><p>添加 M3U／M3U8／TXT 直播源地址</p></div>${I('chevron-right')}</button><button class="type-card" data-go="source-file"><span class="type-icon orange">${I('folder','xl')}</span><div><h4>本地文件</h4><p>从手机选择已有频道列表文件</p></div>${I('chevron-right')}</button><button class="type-card" data-go="source-manual"><span class="type-icon purple">${I('edit-3','xl')}</span><div><h4>手动添加频道</h4><p>自定义频道名称、播放地址和分组</p></div>${I('chevron-right')}</button></div><div class="info-tip">${I('info')}支持常见 IPTV 播放列表格式。导入后可在直播源管理中切换、更新或移除。</div></main>`}
function sourceOnline(){return `<main class="page">${heading('在线订阅')}<div class="glass-card row-left"><span class="type-icon">${I('link')}</span><div><div class="row-title">导入在线直播源</div><p class="row-sub">使用订阅地址定期更新频道</p></div></div><label class="field-label">来源名称</label><input class="field" id="online-name" value="${esc(state.onlineName)}" placeholder="例如：我的 IPTV"/><label class="field-label">订阅 URL</label><textarea class="field textarea" id="online-url" placeholder="https://example.com/playlist.m3u">${esc(state.onlineUrl)}</textarea><p class="field-info">支持 HTTP / HTTPS 链接，格式为 M3U 或 TXT。此演示版本使用模拟解析结果，不访问外部地址。</p><button class="btn primary block" data-act="parse-online">${I('download','sm')} 解析直播源</button><div class="info-tip">${I('shield-check')}演示场景包含重复订阅、输入错误、下载失败和内容不支持等提示。</div></main>`}
function sourceFile(){return `<main class="page">${heading('本地文件导入')}<div class="upload-area">${I('upload','xl')}<h3 id="upload-file-name">选择一个 IPTV 播放列表</h3><p>支持 .m3u / .m3u8 / .txt 格式</p><input id="input-playlist" type="file" accept=".m3u,.m3u8,.txt,text/plain"/></div><label class="field-label">直播源名称</label><input class="field" id="file-source-name" value="我的本地直播源"/><div class="info-tip">${I('info')}文件仅在当前浏览器中进行解析预览，不会上传到服务器。</div><button class="btn primary block" data-act="parse-file">${I('file-check','sm')} 开始解析</button></main>`}
function importResult(){let r=state.importResult;return `<main class="page">${heading('解析结果')}<div class="glass-card" style="text-align:center;padding:26px 16px"><div class="result-circle">${I('check-circle','xl')}</div><h2 style="margin:13px 0 5px;font-size:19px">频道解析完成</h2><p class="subtle">${esc(r.name)} · ${esc(r.type)}</p><div class="metrics"><div class="metric"><b>${r.channels}</b><small>频道数</small></div><div class="metric"><b>${r.groups}</b><small>分组数</small></div><div class="metric"><b>${r.skipped}</b><small>跳过条目</small></div></div><p class="row-sub">请确认解析结果后再导入直播源。</p></div><div class="button-row"><button class="btn secondary" data-act="back">返回修改</button><button class="btn primary" data-act="confirm-import">${I('check','sm')} 确认导入</button></div></main>`}
function sourceManual(edit=false){let c=edit?state.customChannels[0]:null;return `<main class="page">${heading(edit?'编辑自建频道':'添加自建频道')}<div class="glass-card row-left"><span class="type-icon purple">${I('tv')}</span><div><div class="row-title">${edit?'频道信息编辑':'新建独立频道'}</div><p class="row-sub">仅自建频道支持单条修改和删除</p></div></div><label class="field-label">频道名称</label><input class="field" id="manual-name" value="${esc(c?.name||'')}" placeholder="例如：我的高清频道"/><label class="field-label">播放地址</label><textarea class="field textarea" id="manual-url" placeholder="https://... 或 http://...">${esc(c?.url||'')}</textarea><label class="field-label">所属分组</label><select class="field" id="manual-group"><option>未分组</option>${state.cGroups.map(g=>`<option ${c?.group===g?'selected':''}>${esc(g)}</option>`).join('')}</select><button class="text-button" data-go="group-edit" style="margin:12px 0">${I('plus','sm')} 新建或管理分组</button><div class="button-row"><button class="btn primary" data-act="save-channel">${I('save','sm')} ${edit?'保存修改':'保存频道'}</button>${edit?`<button class="btn danger" data-act="delete-channel">${I('trash','sm')} 删除频道</button>`:''}</div></main>`}
function groupEdit(){return `<main class="page">${heading('自建频道分组')}<div class="glass-card"><p class="subtle">分组用于整理手动添加的频道；没有分组的频道归入“未分组”。</p><div id="groups-list">${state.cGroups.map(g=>`<div class="setting-row"><div class="row-left">${I('folder')}<strong style="font-size:13px">${esc(g)}</strong></div><button class="tiny-link" data-act="delete-group" data-val="${esc(g)}">${I('trash','sm')}</button></div>`).join('')}</div></div><label class="field-label">新增分组名称</label><input class="field" id="new-group-name" placeholder="例如：体育直播"/><button class="btn primary block" style="margin-top:13px" data-act="add-group">${I('plus','sm')} 新建分组</button><button class="btn secondary block" style="margin-top:11px" data-go="source-manual">返回频道编辑</button></main>`}

function epgSources(){return `<main class="page">${heading('EPG 订阅管理',`<button class="round-icon" data-go="epg-edit">${I('plus')}</button>`)}<div class="feature-card"><div class="kicker">${I('calendar','sm')} ELECTRONIC PROGRAM GUIDE</div><div class="feature-num">${state.epgSources.length} <span style="font-size:13px;font-weight:500">个节目单来源</span></div><p>自定义节目单优先，内置节目单自动补缺</p></div><div class="info-tip">${I('info')}支持 XML / XML.GZ 订阅，内置源不可修改或删除。</div>${section('已启用来源',null,'覆盖频道与更新时间')}${state.epgSources.map((e,i)=>`<div class="source-card ${e.priority?'current':''}"><div class="row-between"><div class="row-left"><span class="source-icon ${e.type==='内置'?'local':''}">${I('calendar')}</span><div><div class="row-title">${esc(e.name)} ${e.type==='内置'?'<span class="tiny-pill">内置</span>':''}</div><p class="row-sub">${e.priority?'优先':'备用补缺'} · ${e.updated}</p></div></div><span class="tiny-pill">覆盖 ${e.count} 台</span></div><div class="source-actions">${e.type!=='内置'?`<button data-act="priority-epg" data-index="${i}">${I('check','sm')} 设为优先</button><button data-act="edit-epg" data-index="${i}">${I('edit-3','sm')} 编辑</button><button data-act="delete-epg" data-index="${i}">${I('trash','sm')} 删除</button>`:`<button data-act="refresh-epg">${I('refresh-cw','sm')} 刷新内置源</button>`}</div></div>`).join('')}<button class="btn primary block" data-act="refresh-epg" style="margin:16px 0">${I('refresh-cw','sm')} 全部刷新节目单</button><button class="btn secondary block" data-go="epg-edit">${I('plus','sm')} 添加自定义订阅</button></main>`}
function epgEdit(){let e=state.epgEditIndex==null?null:state.epgSources[state.epgEditIndex];return `<main class="page">${heading(e?'编辑 EPG 订阅':'添加 EPG 订阅')}<div class="glass-card"><div class="row-left"><span class="type-icon purple">${I('calendar')}</span><div><div class="row-title">${e?'修改节目单来源':'添加 XMLTV 节目单'}</div><p class="row-sub">自定义来源优先，内置来源补缺</p></div></div></div><label class="field-label">订阅名称</label><input class="field" id="epg-name" value="${esc(e?.name||'')}" placeholder="例如：全国节目单"/><label class="field-label">EPG 订阅地址</label><textarea class="field textarea" id="epg-url" placeholder="https://example.com/epg.xml.gz">${esc(e?.url||'')}</textarea><div class="info-tip">${I('shield-check')}可添加 XML 或 XML.GZ 格式。本原型只演示列表和刷新状态。</div><button class="btn primary block" data-act="save-epg">${I('check','sm')} ${e?'保存修改':'添加订阅'}</button></main>`}
function settings(){return `<main class="page">${heading('设置',`<button class="round-icon" data-go="about">${I('info')}</button>`)}<div class="glass-card settings-brand"><span class="brand-logo">${I('tv','lg')}</span><div><strong>电视直播</strong><small>简洁、纯粹的 IPTV 观看体验</small></div><span class="tiny-pill">v1.0.0</span></div>${section('播放体验')}<div class="setting-list">${toggleRow('picture-in-picture','返回桌面自动小窗','离开应用后通过 Android 画中画继续观看','autoPip')}${rowIcon('external-link','系统小窗权限','查看权限说明','open-permissions')}${rowIcon('headphones','息屏听音说明','支持后台播放与系统媒体控制','open-audio')}${toggleRow('wifi','移动网络播放提醒','使用蜂窝移动网络时弹出确认','mobileReminder')}${toggleRow('radio','按键震动反馈','换台及音量操作提供触感反馈','haptic')}</div>${section('频道与节目单')}<div class="setting-list">${toggleRow('clock','显示频道耗时','频道延迟以毫秒（ms）展示','latency')}${toggleRow('refresh-cw','频道预览检测','后台检测状态与截图缓存','detection')}${toggleRow('calendar','自动更新节目单','自动获取节目单数据和缓存','autoEpg')}${rowIcon('layers','直播源管理',`${state.sources.length} 个来源`,'open-sources')}${rowIcon('calendar','EPG 订阅管理',`${state.epgSources.length} 个节目单源`,'open-epg-sources')}</div>${section('外观与显示')}<div class="setting-list">${rowIcon('settings','界面外观','跟随系统 / 浅色 / 深色','open-appearance',`<span class="tiny-pill">${state.theme==='dark'?'深色':state.theme==='system'?'跟随系统':'浅色'}</span>`)}</div>${section('储存与数据')}<div class="setting-list">${rowIcon('trash','清理截图缓存',`当前 ${state.cache.toFixed(1)} MB`,'clear-cache')}${rowIcon('clock','清空最近观看',`共 ${state.recent.length} 条记录`,'clear-recent')}${rowIcon('info','关于应用','版本与系统信息','open-about')}</div><p class="about-footer">让看电视，回归轻松与简单。</p></main>`}
function appearance(){return `<main class="page">${heading('外观设置')}<p class="page-subtitle">选择喜欢的界面色彩，所有页面会同步更新</p><div class="setting-list">${[['system','跟随系统','与设备的系统主题保持一致'],['light','浅色模式','明亮通透的蓝白玻璃视觉'],['dark','深色模式','在暗光环境中更舒适']].map(([v,n,d])=>`<button class="appearance-row ${state.theme===v?'chosen':''}" data-act="set-theme" data-val="${v}"><span class="setting-icon">${I(v==='light'?'sun':v==='dark'?'moon':'monitor')}</span><span class="setting-text">${n}<small>${d}</small></span>${state.theme===v?I('check-circle'):I('chevron-right')}</button>`).join('')}</div><div class="info-tip">${I('info')}深色模式已包含在本原型中；系统跟随模式会采用浏览器首选配色。</div></main>`}
function about(){return `<main class="page">${heading('关于应用')}<div class="about-icon">${I('tv','xl')}</div><h2 class="about-name">电视直播</h2><div class="about-ver">版本 1.0.0 · UI 设计预览版</div><p class="about-desc">一个专注电视直播观看体验的轻量应用。支持直播源添加、频道管理、收藏、最近观看、EPG 节目单、听音及小窗播放设计。</p><div class="setting-list">${rowIcon('monitor','兼容系统','Android 8.0 及更高版本')}${rowIcon('shield-check','设计规格','SVG 矢量图标 / 内嵌预览素材')}${rowIcon('info','演示说明','当前是高保真交互原型，不含真实视频解码器')}</div><p class="about-footer">DESIGNED FOR A BEAUTIFUL TV EXPERIENCE</p></main>`}
function playbackError(){let c=chById(state.current);return `<main class="page">${heading('播放异常状态')}<div class="glass-card" style="padding:26px 16px;text-align:center"><div class="empty-graphic">${I('alert-circle','xl')}</div><h3>无法连接到频道</h3><p class="row-sub">${esc(c.name)} · 当前播放地址可能已过期</p><img src="${channelImage(c)}" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:18px;opacity:.55;margin:16px 0"/><div class="button-row"><button class="btn primary" data-act="retry">重试连接</button><button class="btn secondary" data-act="next-channel">下一台</button></div><button class="btn secondary block" data-act="refresh-current-source" style="margin-top:12px">刷新所属订阅</button></div><p class="info-tip">${I('info')}演示其他提示：正在连接、频道已移除、地址过期、网络不可用。</p></main>`}
function states(){return `<main class="page">${heading('状态与提示预览')}${section('空状态预览')}<div class="glass-card">${empty('heart','暂无收藏频道','在频道列表点击收藏，频道就会出现在这里。')}</div><div class="glass-card">${empty('clock','暂无观看记录','观看后的电视台会自动出现在最近列表。')}</div><div class="glass-card">${empty('search','没有搜索结果','换个关键词再试一试。')}</div>${section('操作反馈')}<div class="button-row"><button class="btn secondary" data-act="demo-success">成功提示</button><button class="btn secondary" data-act="demo-error">失败提示</button></div><div class="button-row"><button class="btn secondary" data-act="demo-confirm">确认弹窗</button><button class="btn primary" data-go="permissions">权限引导</button></div></main>`}
const routeViews={home,favorites,recent,search:searchPage,player,epg,'epg-match':epgMatch,audio,'pip-info':pipInfo,permissions,sources,'source-detail':sourceDetail,'source-add':sourceAdd,'source-online':sourceOnline,'source-file':sourceFile,'import-result':importResult,'source-manual':()=>sourceManual(false),'channel-edit':()=>sourceManual(true),'group-edit':groupEdit,'epg-sources':epgSources,'epg-edit':epgEdit,settings,appearance,about,'playback-error':playbackError,states};
function themeNow(){return state.theme==='dark'||(state.theme==='system'&&window.matchMedia?.('(prefers-color-scheme: dark)').matches)?'dark':'light'}
function render(preserve=false){let view=$('viewport');if(!view)return;let scroll=view.scrollTop;document.documentElement.dataset.theme=themeNow();$('device').dataset.theme=themeNow();view.innerHTML=(routeViews[state.route]||home)();if(state.route==='fullscreen')view.innerHTML=player();let hasNav=!['fullscreen'].includes(state.route);view.classList.toggle('no-nav',!hasNav);$('bottomnav').innerHTML=hasNav?nav():'';$('bottomnav').style.display=hasNav?'':'none';$('popups').innerHTML=modal||'';if(state.route==='fullscreen')renderFullscreen();else $('fullscreen-overlay').innerHTML='';if(!preserve)view.scrollTop=0;else view.scrollTop=scroll;updateStudio();}
function updateStudio(){let e=$('screen-count');if(e)e.textContent=Object.keys(routeViews).length+' 个页面';}
function go(r){if(!routeViews[r]&&r!=='fullscreen')return;const was=state.route;if(r!==was)state.history.push(was);state.route=r;modal=null;render();}
function back(){let r=state.history.pop()||'home';state.route=r;modal=null;render()}
function notify(s){clearTimeout(toastTimeout);let p=$('toastbox');p.innerHTML=`<div class="toast">${esc(s)}</div>`;toastTimeout=setTimeout(()=>p.innerHTML='',2400)}
function confirmDialog(title,desc,onYes,ok='确认'){modal=`<div class="overlay confirm-overlay"><div class="confirm-box"><h3>${esc(title)}</h3><p>${esc(desc)}</p><div class="button-row"><button class="btn secondary" data-act="cancel-modal">取消</button><button class="btn primary" data-act="confirm-modal">${esc(ok)}</button></div></div></div>`;modalAction=onYes;render(true)}
function closeModal(){modal=null;modalAction=null;render(true)}
function selectChannel(id){state.current=id;state.playing=true;state.showPlayingError=false;state.recent=[id,...state.recent.filter(x=>x!==id)].slice(0,30);go('player')}
function moveChannel(dir){let l=currentChannels();let i=l.findIndex(c=>c.id===state.current);selectChannel(l[(i+dir+l.length)%l.length]?.id||channels[0].id)}
function renderFullscreen(){let c=chById(state.current);$('fullscreen-overlay').innerHTML=`<div class="full-viewport"><img src="${channelImage(c)}"/><div class="full-top"><span>${esc(c.name)} · LIVE</span><button class="round-icon" data-act="exit-fullscreen" aria-label="退出全屏">${I('x')}</button></div><div class="full-controls"><button data-act="prev-channel">${I('skip-back')}</button><button data-act="toggle-play" class="main">${I(state.playing?'pause':'play','xl')}</button><button data-act="next-channel">${I('skip-forward')}</button></div><div class="full-bottom"><p>音量 ${state.volume}%</p><button class="player-act" data-act="volume-down">${I('volume-1')}</button><input id="full-volume" type="range" value="${state.volume}" min="0" max="100"><button class="player-act" data-act="volume-up">${I('volume-2')}</button><div class="button-row" style="justify-content:center;margin-top:20px"><button class="btn secondary small" data-go="audio">听音模式</button><button class="btn secondary small" data-act="show-pip">小窗播放</button></div></div></div>`}
function showPip(){if(!state.settings.autoPip){go('pip-info');return}go('pip-info');notify('设计预览：系统级小窗需要 Android 原生支持')}
function action(act,d){let id=d.id,name=d.name,idx=Number(d.index);switch(act){
case 'back':back();break;case 'set-group':state.group=d.val;render(true);break;case 'player-group':state.playerGroup=d.val;render(true);break;
case 'play':selectChannel(id);break;case 'toggle-play':state.playing=!state.playing;render(true);break;case 'next-channel':moveChannel(1);break;case 'prev-channel':moveChannel(-1);break;
case 'toggle-fav':state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];notify(state.favorites.includes(id)?'已加入收藏':'已取消收藏');render(true);break;
case 'edit-favorites':notify('点击频道进入播放页，可在播放器内取消收藏');break;
case 'remove-recent':state.recent=state.recent.filter(x=>x!==id);render(true);notify('已移除这条记录');break;
case 'clear-recent':confirmDialog('清空观看记录','清空后将无法恢复，是否继续？',()=>{state.recent=[];render();notify('观看记录已清空')},'清空记录');break;
case 'clear-search':state.search='';render(true);break;case 'hot-search':state.search=d.val;go('search');break;
case 'epg-day':state.epgDay=Number(d.val);render(true);break;case 'epg-refresh':case 'refresh-epg':notify('节目单已更新 · 当前为模拟数据');break;case 'restore-match':state.epgMatched='央视新闻';render();notify('已恢复自动匹配');break;
case 'open-permissions':go('permissions');break;case 'open-audio':go('audio');break;case 'open-sources':go('sources');break;case 'open-epg-sources':go('epg-sources');break;case 'open-about':go('about');break;case 'open-appearance':go('appearance');break;
case 'volume-up':state.volume=Math.min(100,state.volume+5);render(true);break;case 'volume-down':state.volume=Math.max(0,state.volume-5);render(true);break;
case 'toggle':state.settings[d.key]=!state.settings[d.key];render(true);break;case 'set-theme':state.theme=d.val;render();break;
case 'show-pip':showPip();break;case 'exit-fullscreen':back();break;case 'retry':state.showPlayingError=false;go('player');notify('重新连接中…（演示）');break;case 'refresh-current-source':notify('来源刷新完成（演示）');break;
case 'source-detail':state.editSource=name;go('source-detail');break;case 'select-source':state.source=name;state.group='全部';go('home');notify('已切换至 '+name);break;
case 'refresh-source':notify('订阅刷新完成（演示）');break;
case 'delete-source':confirmDialog('删除直播源','删除后，该来源的频道、缓存、收藏及观看记录都将移除。',()=>{state.sources=state.sources.filter(x=>x.name!==name);if(state.source===name)state.source=state.sources[0]?.name||'';state.recent=[];state.favorites=[];render();notify('已删除直播源')},'确认删除');break;
case 'save-source':{let s=state.sources.find(x=>x.name===state.editSource);let n=$('edit-source-name')?.value.trim();if(!s||!n)return notify('请输入来源名称');let was=s.name;s.name=n;if(state.source===was)state.source=n;s.url=$('edit-source-url')?.value||s.url;s.file=$('replace-file')?.files?.[0]?.name||s.file;s.updated='刚刚';state.editSource=n;render();notify('已保存修改');break}
case 'parse-online':{let n=$('online-name')?.value.trim();let url=$('online-url')?.value.trim();if(!n||!url)return notify('请输入名称与订阅链接');if(!/^https?:\/\//i.test(url))return notify('订阅地址必须以 http:// 或 https:// 开头');if(state.sources.some(s=>s.url===url))return notify('检测到重复订阅，请更换地址');state.importResult={name:n,type:'在线订阅',channels:328,groups:12,skipped:2,url};state.onlineUrl=url;state.onlineName=n;go('import-result');break}
case 'parse-file':{let f=$('input-playlist')?.files?.[0];if(!f)return notify('请先选择本地文件');let n=$('file-source-name')?.value.trim()||f.name;state.importResult={name:n,type:'本地文件',channels:86,groups:8,skipped:1,file:f.name};go('import-result');break}
case 'confirm-import':{let r=state.importResult;if(!state.sources.some(s=>s.name===r.name))state.sources.push({name:r.name,type:r.type,channels:r.channels,groups:r.groups,updated:'刚刚',url:r.url||'',file:r.file||''});state.source=r.name;go('sources');notify('直播源已成功导入');break}
case 'save-channel':{let n=$('manual-name')?.value.trim(),url=$('manual-url')?.value.trim(),group=$('manual-group')?.value||'未分组';if(!n||!url)return notify('请填写频道名称和地址');if(!/^https?:\/\//i.test(url))return notify('请输入有效的播放地址');if(state.route==='channel-edit'&&state.customChannels.length){Object.assign(state.customChannels[0],{name:n,url,group});}else{state.customChannels.push({id:'mine'+Date.now(),name:n,url,group,source:'我的频道',ms:88});}let mine=state.sources.find(s=>s.type==='手动频道');if(mine)mine.channels=state.customChannels.length;go('sources');notify('自建频道已保存');break}
case 'delete-channel':confirmDialog('删除自建频道','此操作无法撤销。',()=>{state.customChannels.shift();go('sources');notify('频道已删除')},'删除');break;
case 'add-group':{let g=$('new-group-name')?.value.trim();if(!g)return notify('请输入分组名称');if(!state.cGroups.includes(g))state.cGroups.push(g);render(true);notify('已新增分组');break}
case 'delete-group':confirmDialog('删除分组','此分组中的频道将归入未分组。',()=>{state.cGroups=state.cGroups.filter(x=>x!==d.val);state.customChannels.forEach(x=>{if(x.group===d.val)x.group='未分组'});render();notify('已删除分组')});break;
case 'edit-epg':state.epgEditIndex=idx;go('epg-edit');break;case 'priority-epg':state.epgSources.forEach((e,i)=>e.priority=i===idx);render(true);notify('已设置优先来源');break;
case 'delete-epg':{let e=state.epgSources[idx];if(!e||e.type==='内置')return notify('内置节目单不可删除');confirmDialog('删除 EPG 订阅','删除后将无法继续使用该节目单来源。',()=>{state.epgSources.splice(idx,1);render();notify('订阅已删除')},'确认删除');break}
case 'save-epg':{let n=$('epg-name')?.value.trim(),u=$('epg-url')?.value.trim();if(!n||!u)return notify('请填写名称和订阅地址');if(!/^https?:\/\//i.test(u))return notify('请输入有效的订阅地址');if(state.epgEditIndex==null)state.epgSources.push({name:n,type:'自定义',url:u,count:0,updated:'尚未获取',priority:false});else Object.assign(state.epgSources[state.epgEditIndex],{name:n,url:u,updated:'刚刚'});state.epgEditIndex=null;go('epg-sources');notify('EPG 订阅已保存');break}
case 'clear-cache':confirmDialog('清理截图缓存',`当前缓存约 ${state.cache.toFixed(1)} MB，确定清理吗？`,()=>{state.cache=0;render();notify('缓存清理完成')},'清理缓存');break;
case 'cancel-modal':closeModal();break;case 'confirm-modal':{let f=modalAction;modal=null;modalAction=null;render(true);f?.();break}
case 'demo-success':notify('操作成功');break;case 'demo-error':notify('操作失败，请重试');break;case 'demo-confirm':confirmDialog('确认操作','这是一个交互弹窗效果预览。',()=>notify('已确认'));break;
default:notify('交互预览');}
}
document.addEventListener('click',e=>{let btn=e.target.closest('[data-go],[data-act]');if(!btn)return;if(btn.hasAttribute('data-go'))go(btn.dataset.go);else action(btn.dataset.act,btn.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='search-input'){state.search=e.target.value;let r=$('search-results');if(r)r.innerHTML=searchResults();}if(e.target.id==='epg-search'){let el=$('match-list');if(el)el.innerHTML=matchList(e.target.value)}if(e.target.id==='volume-range'||e.target.id==='full-volume'){state.volume=+e.target.value;let c=document.querySelector('.volume-count');if(c)c.textContent=state.volume+'%'}if(e.target.id==='input-playlist'){let label=$('upload-file-name');if(label)label.textContent=e.target.files?.[0]?.name||'选择一个 IPTV 播放列表'}});
document.addEventListener('change',e=>{if(e.target.name==='match'){state.epgMatched=e.target.value;notify('已匹配 '+e.target.value);render(true)}});
state.epgEditIndex=null;
render();
</script></body></html>
