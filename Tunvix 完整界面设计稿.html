function screenshot(c){return c.img?`<img draggable="false" class="channel-pic" src="${c.img}" alt="${esc(c.name)}示例截图"/>`:`<div class="channel-placeholder">${c.logo?`<span class="placeholder-title">${esc(c.logo)}</span>`:icon('tv')}<span class="fallback-badge">暂无画面</span></div>`;}
function card(c,secondary=false){return `<article tabindex="0" role="button" aria-label="播放${esc(c.name)}，长按查看更多操作" data-channel="${c.id}" class="channel-card">${screenshot(c)}<div class="channel-meta"><div class="channel-name">${esc(c.name)}</div>${secondary?`<div class="channel-source">${esc(c.source)}</div>`:''}</div></article>`}
function grid(cs,secondary=false){return `<div class="channel-grid">${cs.map(c=>card(c,secondary)).join('')}</div>`}
function shownChannels(){let list=demoChannels.filter(c=>c.source===s.source); if(s.source==='我的订阅源' && s.group==='央视频道')list=list.filter(c=>['c1','c2','c3','c4','c5','c6','c7','c8'].includes(c.id));else if(s.group==='卫视频道')list=list.filter(c=>['c2','c3','c4','c5','c6','c8'].includes(c.id));else list=list.filter(c=>c.group===s.group);if(s.searchText)list=list.filter(c=>c.name.toLowerCase().includes(s.searchText.toLowerCase()));return list;}
function home(){const list=s.demoEmptyHome?[]:shownChannels(); const top=s.searchOpen?`<div class="search-head"><div class="search-box">${icon('search')}<input id="searchInput" autofocus autocomplete="off" placeholder="搜索频道" value="${esc(s.searchText)}" />${s.searchText?`<button data-act="clear-search" aria-label="清除搜索">${icon('x',17)}</button>`:''}</div><button class="search-cancel" data-act="exit-search">取消</button></div>`:`<div class="topbar"><div class="wordmark">Tun<b>vix</b></div><div class="top-actions"><button class="iconbtn" title="搜索" data-act="search">${icon('search')}</button><button class="iconbtn" title="直播源管理" data-act="go" data-view="sources">${icon('database')}</button></div></div>`;
return `<div class="screen">${top}<div class="source-line"><button class="source-current" data-act="overlay" data-kind="sourceswitch">${icon('cloud',20,'cloud')}<span class="name">${esc(s.source)}</span>${icon('chevron-down',17)}</button>${s.source==='我的订阅源'?`<button class="source-refresh" data-act="refresh" aria-label="刷新订阅">${icon('refresh',21)}</button>`:''}</div><div class="group-strip">${(s.source==='自建频道'?['未分组','我的频道']:groups).map(g=>`<button data-act="group" data-group="${g}" class="group-chip ${s.group===g?'active':''}">${g}</button>`).join('')}</div>${s.demoEmptyHome?`<div class="scroll">${empty('cloud','还没有直播源','添加自己的直播源，开始观看喜爱的频道','添加直播源','go','add')}</div>`:s.searchText && !list.length?`<div class="scroll">${searchEmpty()}</div>`:list.length?`<div class="scroll" id="homeGrid">${grid(list)}</div>`:`<div class="scroll">${empty('tv','暂无频道','此分组暂时没有频道，可以切换其他分组查看')}</div>`}${nav()}</div>`}
function empty(sym,title,desc,btn,act,view){return `<div class="empty-state"><div class="empty-illustration">${icon(sym)}</div><h3>${title}</h3><p>${desc}</p>${btn?`<button class="primary" data-act="${act}" ${view?`data-view="${view}"`:''}>${icon('plus')}${btn}</button>`:''}</div>`}
function searchEmpty(){return `<div class="search-empty">${icon('search')}<strong>没有找到相关频道</strong><p>换个关键词试试，或清除当前搜索条件</p><button data-act="clear-search">清除搜索</button></div>`}
function collection(which){const fav=which==='favorites';const ids=fav?s.favorites:s.recents;const cards=ids.map(ch);return `<div class="screen">${header(fav?'我的收藏':'最近观看','home',`<span class="subtle">${ids.length} 个频道</span>`)}${ids.length?`<div class="section-note"><span>${fav?'收藏的频道会汇总在这里':'按最近观看时间排列'}</span>${!fav?`<button data-act="confirm-clear-history" style="color:var(--primary);font-weight:700">清空记录</button>`:''}</div><div class="scroll">${grid(cards,true)}</div>`:`<div class="scroll">${empty(fav?'star':'clock',fav?'暂无收藏':'暂无观看记录',fav?'看到喜欢的频道，点亮星标就能在这里快速找到。':'看过的频道会自动出现在这里，方便下次继续观看。','浏览频道','go','home')}</div>`}${nav()}</div>`}
function channelPanel(){const current=ch(s.channelId);const currSource=current.source;const cs=demoChannels.filter(x=>x.source===currSource&&(s.playerGroup==='央视频道'?['c1','c2','c3','c4','c5','c6','c7','c8'].includes(x.id):s.playerGroup==='卫视频道'?['c2','c3','c4','c5','c6','c8'].includes(x.id):x.group===s.playerGroup || currSource==='自建频道'));return `<div class="panel-head"><strong>频道列表</strong><span>${cs.length} 个频道</span></div><div class="panel-groups">${(currSource==='自建频道'?['未分组']:groups).map(g=>`<button data-act="player-group" data-group="${g}" class="${s.playerGroup===g?'active':''}">${g}</button>`).join('')}</div>${cs.map((c,i)=>`<button class="channel-row ${c.id===s.channelId?'active':''}" data-act="play" data-id="${c.id}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="ch-title">${c.name}</span>${c.id===s.channelId?icon('volume',16):''}</button>`).join('')||`<div class="page-desc">此分组暂无频道</div>`}`}
function remotePanel(){return `<div class="remote-wrap"><div class="remote-section-label">频道切换</div><div class="remote-skip"><button data-act="skip" data-delta="-1">${icon('skip-prev')}<span>上一台</span></button><button data-act="skip" data-delta="1">${icon('skip-next')}<span>下一台</span></button></div><div class="remote-section-label">媒体音量</div><div class="volume-board"><div class="volume-head"><span>当前音量</span><b id="volText">${s.volume}%</b></div><div class="vol-controls"><button aria-label="音量减" data-act="volstep" data-delta="-5">${icon('minus')}</button><input id="volumeSlider" type="range" min="0" max="100" value="${s.volume}" aria-label="媒体音量"/><button aria-label="音量加" data-act="volstep" data-delta="5">${icon('plus')}</button></div></div><div class="remote-footer">按照当前分组顺序切台，首尾循环<br/>音量与安卓设备媒体音量同步（设计演示）</div></div>`}
function videoState(){if(s.playerStatus==='playing')return '';const loading=s.playerStatus==='loading';const expired=s.playerStatus==='expired';return `<div class="video-state">${icon(loading?'refresh':'alert',31,loading?'spin':'')}<strong>${loading?'正在连接':expired?'播放地址可能已过期':'播放失败'}</strong><p>${loading?'正在尝试连接直播画面，请稍候…':expired?'请尝试刷新订阅后重新播放。':'当前频道暂时无法播放，请稍后重试。'}</p>${!loading?`<div class="actions"><button data-act="retry">${expired?'刷新订阅':'重试'}</button><button data-act="skip" data-delta="1">下一台</button></div>`:''}</div>`}
function player(){const c=ch(s.channelId);return `<div class="screen player-screen"><div class="player-top"><div class="player-header"><button class="backbtn" data-act="leave-player">${icon('chevron-left')}</button><span class="title">${c.name}</span><button class="iconbtn favorite ${s.favorites.includes(c.id)?'on':''}" style="background:#252d40;color:${s.favorites.includes(c.id)?'#9698ff':'#fff'};width:36px;height:36px" data-act="fav" data-id="${c.id}">${icon('star',19)}</button></div><div class="player-video">${c.img?`<img src="${c.img}" alt="静态播放设计示例" />`:`<div style="height:100%;display:grid;place-items:center;color:#66718e">${icon('tv',52)}</div>`}<div class="video-shade" data-act="toggle-controls"></div><div class="video-live"><span class="live-dot"></span>LIVE 直播</div><div class="video-controls" style="${s.showVideoControls?'':'display:none'}"><button class="video-ctl" data-act="pause">${icon(s.paused?'play':'pause')}</button><button class="video-ctl" data-act="fullscreen">${icon('maximize')}</button></div>${videoState()}</div></div><div class="player-tabs"><button class="player-tab ${s.playerTab==='channels'?'active':''}" data-act="panel" data-panel="channels">频道</button><button class="player-tab ${s.playerTab==='remote'?'active':''}" data-act="panel" data-panel="remote">遥控器</button></div><div class="player-scroll" id="playerContent">${s.playerTab==='channels'?channelPanel():remotePanel()}</div></div>`}
function sourcesView(){return `<div class="screen">${header('直播源管理','home',`<button class="iconbtn" title="设置" data-act="go" data-view="settings">${icon('gear')}</button>`)}<div class="page-desc">管理自己添加的订阅和本地频道</div><div class="scroll source-list">${sources.map(x=>`<div class="list-card"><div class="list-icon">${icon(x.fixed?'pen':x.refresh?'cloud':'file')}</div><div class="list-main"><div class="list-title">${x.name}${s.source===x.name?'<span class="pill">当前使用</span>':''}</div><div class="list-sub">${x.kind} · ${x.qty} 个频道</div></div><div class="list-end">${x.refresh?`<button class="tinybtn" title="刷新" data-act="refresh">${icon('refresh')}</button>`:''}${x.fixed?'':`<button class="tinybtn" title="编辑" data-act="edit-source" data-source="${x.name}">${icon('pen')}</button><button class="tinybtn" title="删除" data-act="delete-source" data-source="${x.name}">${icon('trash')}</button>`}</div></div>`).join('')}</div><div class="fixed-action"><button class="primary" data-act="go" data-view="add">${icon('plus')}添加直播源</button></div></div>`}
function editSourceView(){const x=sources.find(t=>t.name===s.editingSource)||sources[0];const local=!x.refresh;return `<div class="screen">${header(local?'重新导入文件':'编辑直播源','sources')}<div class="scroll"><div class="form-scroller"><div class="field"><label>直播源名称<em>*</em></label><input class="inputbox" id="formName" value="${esc(s.formName||x.name)}" placeholder="为直播源命名" /></div>${local?`<div class="field"><label>本地频道文件</label><button class="upload-box" data-act="select-file">${icon('upload')}<strong>${s.fileSelected?'已选择新文件':'重新选择文件'}</strong><span class="upload-sub">M3U / M3U8 / TXT</span></button><div class="helper">重新导入时更新此直播源的频道列表。</div></div>`:`<div class="field"><label>订阅链接<em>*</em></label><textarea class="inputbox textarea" id="formLink" placeholder="粘贴订阅地址">${esc(s.formLink)}</textarea><div class="helper">修改链接后可刷新订阅，更新其中的频道。</div></div>`}<div class="form-hint">${icon('info')}${local?'本地文件需要重新选择才能更新频道。':'编辑订阅源不会直接修改已导入的频道内容。'}</div></div></div><div class="fixed-action"><button class="primary" data-act="save-source">${icon('check')}保存修改</button></div></div>`}
function addChoice(){return `<div class="screen">${header('添加直播源','sources')}<div class="page-desc">选择一种方式，导入你自己的频道。</div><div class="scroll"><button class="add-type" data-act="go" data-view="subscribe"><div class="add-icon">${icon('link')}</div><div class="list-main"><div class="at-title">订阅链接</div><div class="at-sub">支持 M3U / M3U8 频道列表<br/>及兼容的 APTV 订阅</div></div>${icon('chevron-right',18,'arrow')}</button><button class="add-type" data-act="go" data-view="local"><div class="add-icon green">${icon('file')}</div><div class="list-main"><div class="at-title">本地文件</div><div class="at-sub">从设备选择 M3U、M3U8<br/>或 TXT 频道列表</div></div>${icon('chevron-right',18,'arrow')}</button><button class="add-type" data-act="go" data-view="manual"><div class="add-icon orange">${icon('pen')}</div><div class="list-main"><div class="at-title">手动添加频道</div><div class="at-sub">填写频道名称和播放链接<br/>保存到「自建频道」</div></div>${icon('chevron-right',18,'arrow')}</button></div></div>`}
function formView(type){const manual=type==='manual',local=type==='local';const edit=manual&&s.currentEdit;const title=manual?(edit?'编辑频道':'手动添加频道'):local?'本地文件导入':'订阅链接';const back=edit?'sources':'add';return `<div class="screen">${header(title,back)}<div class="scroll"><div class="form-scroller">${local?`<button class="upload-box" data-act="select-file">${icon('upload')}<strong>${s.fileSelected?'已选择文件':'选择本地文件'}</strong><span class="upload-sub">M3U / M3U8 / TXT</span></button>${s.fileSelected?`<div class="preview-select">${icon('file')}<span class="txt">我的频道列表.m3u</span><button data-act="select-file">${icon('refresh',17)}</button></div>`:''}`:''}<div class="field"><label>${manual?'频道名称':'直播源名称'}<em>*</em></label><input class="inputbox" id="formName" placeholder="${manual?'例如：我的高清频道':local?'例如：家庭电视列表':'例如：我的订阅源'}" value="${esc(s.formName||(local&&s.fileSelected?'我的频道列表':''))}" /></div><div class="field"><label>${manual?'播放链接':'订阅链接'}${!local?'<em>*</em>':''}</label>${local?`<div class="form-hint">${icon('info')}请先从安卓系统文件选择器中选择频道列表，文件内容将在本地解析。</div>`:manual?`<textarea id="formLink" class="inputbox textarea" placeholder="请输入以 https:// 或 http:// 开头的直接播放地址">${esc(s.formLink)}</textarea><div class="helper">支持常见的直播播放地址，长链接可自动换行。</div>`:`<textarea id="formLink" class="inputbox textarea" placeholder="粘贴 M3U / M3U8 或 APTV 订阅地址">${esc(s.formLink)}</textarea><div class="helper">重复导入时会提示刷新已有直播源，不会直接创建重复源。</div>`}</div>${manual?`<div class="field"><label>频道分组（可选）</label><button class="field-select" data-act="overlay" data-kind="groupselect"><span>${esc(s.formGroup)}</span>${icon('chevron-down',17)}</button><div class="helper">不选择时归入「未分组」，统一保存在「自建频道」。</div></div>`:''}</div></div><div class="fixed-action"><button class="primary" data-act="${manual?'save-channel':'parse'}">${icon(manual?'check':'arrow-right')}${manual?(edit?'保存修改':'保存频道'):'解析'+(local?'文件':'订阅')}</button></div></div>`}
function importResult(){return `<div class="screen">${header('导入结果','sources')}<div class="scroll"><div class="result-center"><div class="result-circle">${icon('check')}</div><h2>解析完成</h2><p>频道列表已成功识别<br/>确认后即可在首页查看</p></div><div class="statline"><div class="statbox"><strong style="color:var(--primary)">128</strong><span>有效频道</span></div><div class="statbox"><strong>12</strong><span>频道分组</span></div></div><div class="notice">${icon('info',17)}<span>其中 3 条内容无法识别，已自动跳过，不影响其他频道导入。</span></div><div class="list-card"><div class="list-icon">${icon('file')}</div><div class="list-main"><div class="list-title">${esc(s.formName||'我的新订阅')}</div><div class="list-sub">${s.importType==='local'?'本地文件':'在线订阅'} · 即将导入</div></div>${icon('check',18)}</div></div><div class="fixed-action"><button class="primary" data-act="confirm-import">${icon('check')}确认导入</button></div></div>`}
function settingsView(){return `<div class="screen">${header('设置','sources')}<div class="scroll"><div class="setting-title">播放与网络</div><div class="settings-box"><div class="setting-row"><div class="setting-ico">${icon('wifi')}</div><div class="setting-main"><div class="setting-name">移动网络播放提醒</div><div class="setting-note">使用移动网络播放前提示流量消耗</div></div><button class="toggle ${s.mobileReminder?'on':''}" data-act="toggle-reminder"><span></span></button></div><div class="setting-row"><div class="setting-ico">${icon('vibrate')}</div><div class="setting-main"><div class="setting-name">按键震动反馈</div><div class="setting-note">遥控器点击时提供轻微震动</div></div><button class="toggle ${s.vibrate?'on':''}" data-act="toggle-vibrate"><span></span></button></div></div><div class="setting-title">存储与记录</div><div class="settings-box"><button class="setting-row" style="width:100%;text-align:left" data-act="confirm-cache"><div class="setting-ico">${icon('image')}</div><div class="setting-main"><div class="setting-name">截图缓存</div><div class="setting-note">清理已保存的频道截图</div></div><span class="setting-value">38.6 MB</span>${icon('chevron-right',16)}</button><button class="setting-row" style="width:100%;text-align:left" data-act="confirm-clear-history"><div class="setting-ico">${icon('clock')}</div><div class="setting-main"><div class="setting-name">最近观看</div><div class="setting-note">清空全部观看记录</div></div>${icon('chevron-right',16)}</button></div><div class="setting-title">其他</div><div class="settings-box"><button class="setting-row" style="width:100%;text-align:left" data-act="go" data-view="about"><div class="setting-ico">${icon('info')}</div><div class="setting-main"><div class="setting-name">关于 Tunvix</div></div><span class="setting-value">v1.0.0</span>${icon('chevron-right',16)}</button></div></div></div>`}
function aboutView(){return `<div class="screen">${header('关于 Tunvix','settings')}<div class="scroll"><div class="about-card"><div class="about-logo">T</div><strong>Tunvix</strong><span>版本 1.0.0 · Android</span></div><div class="settings-box"><div class="setting-row"><div class="setting-ico">${icon('tv')}</div><div class="setting-main"><div class="setting-name">属于你的直播播放器</div><div class="setting-note">自行导入播放源 · 不内置任何直播频道</div></div></div><div class="setting-row"><div class="setting-ico">${icon('info')}</div><div class="setting-main"><div class="setting-name">兼容系统</div><div class="setting-note">Android 10 及以上</div></div></div></div></div></div>`}
function overlay(){if(!s.overlay)return '';const o=s.overlay; if(o.type==='sourceswitch')return `<div class="scrim" data-overlaybg="1"><div class="sheet"><div class="handle"></div><div class="sheet-heading">切换直播源</div><p class="sheet-small">选择要浏览的直播源</p>${sources.map(x=>`<button class="sheet-entry" data-act="choose-source" data-source="${x.name}">${icon(x.fixed?'pen':x.refresh?'cloud':'file')}<span>${x.name}<small style="display:block;color:#9aa4ba;margin-top:4px">${x.kind} · ${x.qty} 个频道</small></span>${x.name===s.source?icon('check',21,'check'):''}</button>`).join('')}<div class="sheet-divider"></div><button class="sheet-entry" style="color:var(--primary)" data-act="go" data-view="add">${icon('plus')}<span>添加直播源</span></button></div></div>`;
if(o.type==='channelmenu'){const c=ch(o.id);return `<div class="scrim" data-overlaybg="1"><div class="sheet"><div class="handle"></div><div class="sheet-heading">${esc(c.name)}</div><button class="sheet-entry" data-act="fav" data-id="${c.id}">${icon('star')}<span>${s.favorites.includes(c.id)?'取消收藏':'加入收藏'}</span></button>${c.custom?`<button class="sheet-entry" data-act="edit-channel" data-id="${c.id}">${icon('pen')}<span>编辑频道</span></button><button class="sheet-entry" data-act="delete-channel" data-id="${c.id}">${icon('trash')}<span class="danger">删除频道</span></button>`:''}${s.view==='recent'?`<button class="sheet-entry" data-act="remove-recent" data-id="${c.id}">${icon('x')}<span>移除观看记录</span></button>`:''}</div></div>`}
if(o.type==='groupselect'){return `<div class="scrim" data-overlaybg="1"><div class="sheet"><div class="handle"></div><div class="sheet-heading">选择频道分组</div>${['未分组','央视频道','体育','电影','新建分组'].map(g=>`<button class="sheet-entry" data-act="choose-group" data-group="${g}">${icon(g==='新建分组'?'plus':'folder')}<span>${g}</span>${s.formGroup===g?icon('check',20,'check'):''}</button>`).join('')}</div></div>`}
if(o.type==='dialog'){return `<div class="dialog-wrap" data-overlaybg="1"><div class="dialog"><div class="dialog-symbol ${o.danger?'':'blue'}">${icon(o.danger?'alert':'info')}</div><h3>${o.title}</h3><p>${o.message}</p><div class="dialog-actions"><button data-act="close-overlay">取消</button><button class="accept ${o.danger?'delete':''}" data-act="dialog-confirm">${o.confirm||'确定'}</button></div></div></div>`}
if(o.type==='network'){return `<div class="dialog-wrap"><div class="dialog"><div class="dialog-symbol blue">${icon('wifi')}</div><h3>当前正在使用移动网络</h3><p>直播视频可能消耗较多流量，是否继续播放？确认后不再提醒，可在设置中重新开启。</p><div class="dialog-actions"><button data-act="close-overlay">取消</button><button class="accept" data-act="network-confirm">继续播放</button></div></div></div>`}
if(o.type==='failure'){return `<div class="dialog-wrap"><div class="dialog"><div class="dialog-symbol blue">${icon('alert')}</div><h3>${o.title}</h3><p>${o.message}</p><div class="dialog-actions"><button data-act="close-overlay">返回</button><button class="accept" data-act="close-overlay">知道了</button></div></div></div>`}
return ''}
function landscape(){const c=ch(s.channelId);return `<div class="landscape-overlay"><div class="landscape-body" data-act="fulltap">${c.img?`<img src="${c.img}" alt="直播演示画面"/>`:''}<div class="ls-gradient"></div><div class="ls-top" style="${s.showFullControls?'':'display:none'}"><button class="ls-circle" data-act="fullscreen">${icon('minimize')}</button><span class="ls-name">${c.name}</span><span style="font-size:12px;display:flex;gap:7px;align-items:center"><span class="live-dot"></span>直播中</span></div><div class="ls-bottom" style="${s.showFullControls?'':'display:none'}"><div class="ls-actions"><button class="ls-circle" data-act="skip" data-delta="-1">${icon('skip-prev')}</button><button class="ls-circle" data-act="pause">${icon(s.paused?'play':'pause')}</button><button class="ls-circle" data-act="skip" data-delta="1">${icon('skip-next')}</button></div><div class="ls-volume"><button class="ls-circle" data-act="volstep" data-delta="-5">${icon('minus')}</button><input type="range" value="${s.volume}" min="0" max="100" id="landscapeVolume"/><button class="ls-circle" data-act="volstep" data-delta="5">${icon('plus')}</button></div></div></div></div>`}
const designGroups=[['基础页面',[['home','频道首页'],['favorites','收藏页'],['recent','最近观看'],['emptyHome','首次打开 / 无直播源'],['emptyFavorites','暂无收藏'],['emptyRecent','暂无观看记录'],['searchEmpty','无搜索结果']]],['播放体验',[['playerChannels','竖屏播放 / 频道'],['playerRemote','竖屏播放 / 遥控器'],['fullscreen','横屏全屏'],['loading','正在连接'],['playFailure','播放失败'],['expired','地址可能过期'],['network','移动网络确认']]],['直播源与导入',[['sourceSwitch','直播源切换弹层'],['sources','直播源管理'],['editSourceOnline','编辑在线直播源'],['editSourceLocal','重新导入本地文件'],['add','添加方式'],['subscribe','订阅链接导入'],['local','本地文件导入'],['manual','手动添加频道'],['importResult','导入结果'],['duplicate','重复链接提示'],['refreshFail','刷新失败'],['importFail','无法识别的文件'],['downloadFail','下载失败'],['addressMissing','地址不存在'],['accessDenied','服务器拒绝访问'],['editManual','编辑自建频道']]],['设置与弹层',[['settings','设置'],['about','关于 Tunvix'],['channelMenu','频道长按菜单'],['recentMenu','最近观看菜单'],['deleteSource','删除直播源确认'],['deleteChannel','删除频道确认']]]];
function index(){return `<div class="design-index"><div class="design-index-header"><div><div class="design-index-title">Tunvix 界面索引</div><div style="color:#9ba5ba;font-size:12px;margin-top:7px">设计预览入口 · 点击查看各页面</div></div><button class="iconbtn" data-act="toggle-index">${icon('x')}</button></div><div class="index-list">${designGroups.map(([title,items])=>`<div class="index-category">${title}</div>${items.map(([id,n])=>`<button class="index-button" data-act="preview" data-preview="${id}"><span>${n}</span>${icon('chevron-right')}</button>`).join('')}`).join('')}</div></div>`}
function render(){let html='';const dark=s.view==='player';switch(s.view){case 'home':html=home();break;case 'favorites':html=collection('favorites');break;case 'recent':html=collection('recent');break;case 'player':html=player();break;case 'sources':html=sourcesView();break;case 'editSource':html=editSourceView();break;case 'add':html=addChoice();break;case 'subscribe':case 'local':case 'manual':html=formView(s.view);break;case 'result':html=importResult();break;case 'settings':html=settingsView();break;case 'about':html=aboutView();break;default:html=home()}
app.innerHTML=statusbar(dark)+html+gesture(dark)+overlay()+(s.fullscreen?landscape():'')+(s.showIndex?index():'')+(s.toast?`<div class="toast">${s.toast}</div>`:'');if(s.searchOpen && s.view==='home' && document.activeElement?.id!=='searchInput' && s.focusSearch){const input=document.getElementById('searchInput');input?.focus();input?.setSelectionRange(input.value.length,input.value.length);s.focusSearch=false}}
function go(v){s.overlay=null;s.fullscreen=false;s.toast='';if(v==='home'){s.searchOpen=false;s.searchText='';s.demoEmptyHome=false};if(v==='subscribe'||v==='local'||v==='manual'){s.formName='';s.formLink='';s.formGroup='未分组';s.fileSelected=false;s.currentEdit=false;s.importType=v};s.view=v;render()}
function showToast(str){s.toast=str;render();setTimeout(()=>{if(s.toast===str){s.toast='';render()}},2100)}
function play(id){s.channelId=id;if(!s.recents.includes(id))s.recents.unshift(id);else{s.recents=s.recents.filter(x=>x!==id);s.recents.unshift(id)}s.playerGroup=ch(id).group;s.playerStatus='playing';s.paused=false;s.showVideoControls=true;s.view='player';s.overlay=null;render()}
function skip(delta){const cur=ch(s.channelId);let arr=demoChannels.filter(c=>c.source===cur.source && c.group===cur.group);if(cur.group==='央视频道' && cur.source==='我的订阅源')arr=demoChannels.filter(c=>c.source===cur.source&&['c1','c2','c3','c4','c5','c6','c7','c8'].includes(c.id));if(arr.length){const idx=arr.findIndex(x=>x.id===s.channelId);s.channelId=arr[(idx+delta+arr.length)%arr.length].id;s.playerGroup=ch(s.channelId).group;s.playerStatus='playing';s.recents=s.recents.filter(x=>x!==s.channelId);s.recents.unshift(s.channelId);render()}}
function openDialog(title,message,action,confirm='确定',danger=false,payload={}){s.overlay={type:'dialog',title,message,action,confirm,danger,...payload};render()}
function preview(id){s.showIndex=false;s.overlay=null;s.searchOpen=false;s.searchText='';s.demoEmptyHome=false;s.fullscreen=false;s.playerStatus='playing';s.source='我的订阅源';s.group='央视频道';s.formName='';s.formLink='';s.formGroup='未分组';s.fileSelected=false;s.currentEdit=false;s.favorites=s.favorites.length?s.favorites:['c1','c4','c7'];s.recents=s.recents.length?s.recents:['c2','c1','c5'];if(id==='emptyHome'){s.view='home';s.demoEmptyHome=true}else if(id==='emptyFavorites'){s.view='favorites';s.favorites=[]}else if(id==='emptyRecent'){s.view='recent';s.recents=[]}else if(id==='searchEmpty'){s.view='home';s.searchOpen=true;s.searchText='不存在的频道'}else if(['playerChannels','playerRemote','loading','playFailure','expired','fullscreen'].includes(id)){s.view='player';s.channelId='c1';s.playerTab=id==='playerRemote'?'remote':'channels';s.playerStatus=id==='loading'?'loading':id==='playFailure'?'failed':id==='expired'?'expired':'playing';if(id==='fullscreen')s.fullscreen=true}else if(id==='sourceSwitch'){s.view='home';s.overlay={type:'sourceswitch'}}else if(id==='network'){s.view='player';s.overlay={type:'network'}}else if(id==='duplicate'){s.view='subscribe';s.overlay={type:'failure',title:'该订阅已存在',message:'这个链接已添加。可以返回直播源管理页，刷新已有的订阅。'}}else if(id==='refreshFail'){s.view='home';s.overlay={type:'failure',title:'刷新失败',message:'暂时无法连接服务器，原有频道列表已保留。'}}else if(id==='importFail'){s.view='local';s.overlay={type:'failure',title:'无法识别此文件',message:'未找到有效的频道信息，请检查文件格式或尝试其他文件。'}}else if(id==='downloadFail'||id==='addressMissing'||id==='accessDenied'){const t={downloadFail:['下载失败','暂时无法下载此订阅，请检查网络后重试。'],addressMissing:['找不到此地址','请确认订阅链接是否正确，或联系直播源提供方。'],accessDenied:['无法访问此订阅','服务器拒绝了本次访问，请检查链接权限。']};s.view='subscribe';s.overlay={type:'failure',title:t[id][0],message:t[id][1]}}else if(id==='editSourceOnline'||id==='editSourceLocal'){const x=sources[id==='editSourceLocal'?1:0];s.view='editSource';s.editingSource=x.name;s.formName=x.name;s.formLink=x.refresh?'https://example.com/playlist.m3u':'';s.fileSelected=false}else if(id==='importResult'){s.view='result';s.importType='subscribe'}else if(id==='editManual'){s.view='manual';s.currentEdit=true;s.formName='我的测试频道';s.formLink='https://example.com/live.m3u8';s.formGroup='未分组'}else if(id==='channelMenu'){s.view='home';s.overlay={type:'channelmenu',id:'c15'};s.source='自建频道';s.group='未分组'}else if(id==='recentMenu'){s.view='recent';s.overlay={type:'channelmenu',id:'c2'}}else if(id==='deleteSource'){s.view='sources';s.overlay={type:'dialog',title:'删除直播源？',message:'删除后将同时移除该源的频道、截图缓存、收藏及观看记录，此操作无法撤销。',action:'delete-source',confirm:'删除直播源',danger:true}}else if(id==='deleteChannel'){s.view='manual';s.overlay={type:'dialog',title:'删除此频道？',message:'「我的测试频道」将从自建频道中移除，此操作无法撤销。',action:'delete-channel',confirm:'删除频道',danger:true}}else{s.view=id};render()}
function act(el){const a=el.dataset.act;if(!a)return;switch(a){case 'go':go(el.dataset.view);break;case 'search':s.searchOpen=true;s.focusSearch=true;render();break;case 'exit-search':s.searchOpen=false;s.searchText='';render();break;case 'clear-search':s.searchText='';s.focusSearch=true;render();break;case 'group':s.group=el.dataset.group;render();break;case 'overlay':s.overlay={type:el.dataset.kind};render();break;case 'choose-source':s.source=el.dataset.source;s.group=s.source==='自建频道'?'未分组':s.source==='体育精选'?'体育':'央视频道';s.overlay=null;s.view='home';render();break;case 'refresh':showToast('正在刷新订阅，原频道列表保持可用');break;case 'fav':{const id=el.dataset.id;s.favorites=s.favorites.includes(id)?s.favorites.filter(x=>x!==id):[id,...s.favorites];s.overlay=null;render();break}case 'play':play(el.dataset.id);break;case 'leave-player':go('home');break;case 'pause':s.paused=!s.paused;render();break;case 'fullscreen':s.fullscreen=!s.fullscreen;s.showFullControls=true;render();break;case 'toggle-controls':s.showVideoControls=!s.showVideoControls;render();break;case 'fulltap':s.showFullControls=!s.showFullControls;render();break;case 'skip':skip(Number(el.dataset.delta));break;case 'volstep':s.volume=Math.max(0,Math.min(100,s.volume+Number(el.dataset.delta)));render();break;case 'panel':s.playerTab=el.dataset.panel;render();break;case 'player-group':s.playerGroup=el.dataset.group;render();break;case 'toggle-reminder':s.mobileReminder=!s.mobileReminder;render();break;case 'toggle-vibrate':s.vibrate=!s.vibrate;render();break;case 'select-file':s.fileSelected=true;render();break;case 'choose-group':if(el.dataset.group==='新建分组'){s.formGroup='我的分组';s.overlay=null;showToast('演示：已新建「我的分组」')}else{s.formGroup=el.dataset.group;s.overlay=null;render()}break;case 'parse':{s.formName=document.getElementById('formName')?.value||s.formName;s.formLink=document.getElementById('formLink')?.value||s.formLink;if(s.view==='local'&&!s.fileSelected){s.fileSelected=true;showToast('示例文件已选择，点击解析文件');break}if(!s.formName){showToast('请输入直播源名称');break}if(s.view==='subscribe'&&!s.formLink){s.formLink='https://example.com/channels.m3u';showToast('已填入演示链接，再次点击解析');break}if(s.formLink&&s.formLink.includes('duplicate')){s.overlay={type:'failure',title:'该订阅已存在',message:'此订阅链接已经添加，建议刷新已有直播源。'};render();break}s.importType=s.view;s.view='result';render();break}case 'save-channel':{const n=document.getElementById('formName')?.value||s.formName;const u=document.getElementById('formLink')?.value||s.formLink;if(!n||!u){showToast('请填写频道名称和播放链接');break}if(s.currentEdit){const c=demoChannels.find(x=>x.id==='c15');if(c){c.name=n;c.group=s.formGroup}}else{demoChannels.push({id:'custom'+Date.now(),name:n,source:'自建频道',group:s.formGroup,img:null,custom:true});sources.find(x=>x.fixed).qty++}s.source='自建频道';s.group=s.formGroup;s.currentEdit=false;s.view='home';showToast('频道已保存到自建频道');break}case 'confirm-import':s.view='home';s.source='我的订阅源';s.group='央视频道';showToast('直播源已成功导入');break;case 'edit-source':{const x=sources.find(q=>q.name===el.dataset.source);if(x?.fixed){showToast('自建频道请在频道卡片中管理');break}s.editingSource=x.name;s.formName=x.name;s.formLink=x.refresh?'https://example.com/playlist.m3u':'';s.fileSelected=false;s.view='editSource';render();break}case 'save-source':{const x=sources.find(q=>q.name===s.editingSource);const n=document.getElementById('formName')?.value?.trim();if(!n){showToast('请输入直播源名称');break}if(x){const old=x.name;x.name=n;demoChannels.filter(c=>c.source===old).forEach(c=>c.source=n);if(s.source===old)s.source=n;}s.view='sources';showToast('直播源信息已保存');break}case 'delete-source':openDialog('删除直播源？','删除后将同时移除该源的频道、截图缓存、收藏和观看记录，此操作无法撤销。','delete-source','删除直播源',true,{source:el.dataset.source});break;case 'confirm-cache':openDialog('清理截图缓存？','将删除保存在本机的频道截图，下次通过 Wi-Fi 浏览时会重新获取。','clear-cache','清理缓存');break;case 'confirm-clear-history':openDialog('清空观看记录？','此操作会移除全部最近观看记录，不影响直播源与收藏。','clear-history','清空记录',true);break;case 'close-overlay':s.overlay=null;render();break;case 'dialog-confirm':{const o=s.overlay;s.overlay=null;if(o.action==='clear-history'){s.recents=[];showToast('观看记录已清空')}else if(o.action==='clear-cache'){showToast('截图缓存已清理')}else if(o.action==='delete-source'){showToast('直播源已删除（界面演示）')}else if(o.action==='delete-channel'){demoChannels.splice(demoChannels.findIndex(x=>x.id==='c15'),1);s.view='sources';showToast('频道已删除')}else render();break}case 'network-confirm':s.overlay=null;s.mobileReminder=false;render();break;case 'edit-channel':s.overlay=null;s.view='manual';s.currentEdit=true;const c=ch(el.dataset.id);s.formName=c.name;s.formLink='https://example.com/stream.m3u8';s.formGroup=c.group;render();break;case 'delete-channel':openDialog('删除频道？','确定删除这个自建频道吗？删除后无法恢复。','delete-channel','删除频道',true);break;case 'remove-recent':s.recents=s.recents.filter(x=>x!==el.dataset.id);s.overlay=null;render();break;case 'toggle-index':s.showIndex=!s.showIndex;render();break;case 'preview':preview(el.dataset.preview);break;case 'retry':s.playerStatus='loading';render();setTimeout(()=>{s.playerStatus='playing';render()},1100);break}}
let swipeX=null,swipeY=null;app.addEventListener('touchstart',e=>{if(e.target.closest('#playerContent')){swipeX=e.touches[0].clientX;swipeY=e.touches[0].clientY;}},{passive:true});app.addEventListener('touchend',e=>{if(swipeX!==null && s.view==='player' && !e.target.closest('input')){let dx=e.changedTouches[0].clientX-swipeX,dy=e.changedTouches[0].clientY-swipeY;if(Math.abs(dx)>65 && Math.abs(dx)>Math.abs(dy)*1.4){s.playerTab=dx<0?'remote':'channels';render();}swipeX=swipeY=null;}},{passive:true});let holdTimer=0,held=false,downCard=null;app.addEventListener('pointerdown',e=>{const card=e.target.closest('[data-channel]');if(card){downCard=card;held=false;holdTimer=setTimeout(()=>{held=true;s.overlay={type:'channelmenu',id:card.dataset.channel};render()},560)}});['pointerup','pointercancel','pointerleave'].forEach(t=>app.addEventListener(t,()=>clearTimeout(holdTimer)));
app.addEventListener('contextmenu',e=>{const card=e.target.closest('[data-channel]');if(card){e.preventDefault();clearTimeout(holdTimer);held=true;s.overlay={type:'channelmenu',id:card.dataset.channel};render()}});
app.addEventListener('click',e=>{if(e.target.dataset.overlaybg==='1'){s.overlay=null;render();return}const btn=e.target.closest('[data-act]');if(btn){act(btn);return}const card=e.target.closest('[data-channel]');if(card){if(held){held=false;return}play(card.dataset.channel)}});
app.addEventListener('input',e=>{if(e.target.id==='searchInput'){s.searchText=e.target.value;const host=document.getElementById('homeGrid');const found=shownChannels();if(host){host.innerHTML=found.length?grid(found):searchEmpty()}else{s.focusSearch=true;render()}}if(e.target.id==='volumeSlider'||e.target.id==='landscapeVolume'){s.volume=Number(e.target.value);const t=document.getElementById('volText');if(t)t.textContent=s.volume+'%'}if(e.target.id==='formName')s.formName=e.target.value;if(e.target.id==='formLink')s.formLink=e.target.value});
app.addEventListener('keydown',e=>{if(e.key==='Enter' && e.target.closest('[data-channel]'))play(e.target.closest('[data-channel]').dataset.channel)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){s.showIndex=false;s.overlay=null;if(s.fullscreen)s.fullscreen=false;render();return}if((e.key==='d'||e.key==='D')&&!(e.target instanceof HTMLInputElement)&&!(e.target instanceof HTMLTextAreaElement)){s.showIndex=!s.showIndex;render()}});
if(new URLSearchParams(location.search).has('review')||location.hash==='#pages')s.showIndex=true;
render();
</script>
